[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./config" }, { access = "read-write", path = "./deployments" }]
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC_URL}"

[lint]
# Intentional: block.timestamp for oracle staleness, partial oracle tuple reads, oracle/stock calls in
# bounded loops, and checks-effects-interactions ordering with nonReentrant on trusted protocol tokens.
exclude_lints = ["block-timestamp", "unused-return", "require-revert-in-loop", "calls-loop", "reentrancy-no-eth", "reentrancy-events", "costly-loop", "screaming-snake-case-immutable", "unsafe-cheatcode", "named-struct-fields"]
